services:
  db:
    image: postgres:15-alpine
    container_name: trend_investorr_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: trend_inv_2026
      POSTGRES_DB: trend_investorr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
