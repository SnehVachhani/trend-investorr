# ──────────────────────────────────────────────────────────────
# Trend-Investorr — Spring Boot application configuration
# Port of config/settings.py (.env-driven Pydantic settings)
# Runtime-tunable values (was the app_config DB table) remain in DB;
# static secrets / connection strings live here.
# ──────────────────────────────────────────────────────────────

spring:
  application:
    name: trend-investorr

  # ── Datasource (was DB_* in settings.py) ───────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:trend_investorr}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: ${DB_MIN_CONNECTIONS:2}
      maximum-pool-size: ${DB_MAX_CONNECTIONS:10}
      pool-name: TrendInvestorrPool

  # ── JPA (replaces storage/database.py + storage/models.py) ─
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Kolkata
        default_schema: public

  # ── Flyway (replaces run_migrations() in database.py) ────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ── App-level settings (was Settings class in config/settings.py) ──
app:
  env: ${APP_ENV:development}
  log-level: ${LOG_LEVEL:INFO}
  trading-mode: ${TRADING_MODE:PAPER}
  total-capital: ${TOTAL_CAPITAL:10000000.0}

  # Angel One SmartAPI (was ANGEL_* env vars)
  angel:
    api-key: ${ANGEL_API_KEY:}
    client-id: ${ANGEL_CLIENT_ID:}
    password: ${ANGEL_PASSWORD:}
    totp-secret: ${ANGEL_TOTP_SECRET:}

  # Google Gemini (optional; null/blank = disabled, like has_gemini_key)
  gemini:
    api-key: ${GEMINI_API_KEY:}

  # Vault (was .vault file + SecureVault)
  vault:
    master-key: ${VAULT_MASTER_KEY:}
    path: ${VAULT_PATH:.vault}

  # Telegram notifier (from vault in Python)
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}

# ── Runtime-tunable scanner thresholds (was app_config table) ──
scanner:
  volume:
    spike-multiplier: 2.0
  min-price: 50.0
  max-price: 5000.0
  min-avg-volume: 50000
  min-confluence: 0.35
  min-scanners: 2
  max-entries-per-cycle: 5
  orb-minutes: 15
  connors-rsi-entry: 25.0
  connors-rsi-exit: 40.0
  connors-max-hold: 10

# ── Trading risk (was RiskConfig / CircuitBreakerConfig) ──
trading:
  max-capital-per-trade-pct: 5.0
  max-daily-loss-pct: 2.0
  max-open-positions: 20
  default-stop-loss-pct: 2.0
  default-target-pct: 5.0
  slippage-pct: 0.1
  circuit-breaker:
    daily-loss-pct: 3.0
    consecutive-losses: 5

# ── Data ingestion (was DataIngestionService) ──
data:
  backfill-days: 365
  warmup-days: 90
  candle-interval-min: 5
  tick-retention-days: 3

logging:
  level:
    root: ${app.log-level}
    com.trendinvestorr: DEBUG
  pattern:
    console: "%d{HH:mm:ss} | %-5level | %logger{36} — %msg%n"

server:
  port: 8000
